name: Build Docker image (publish disabled, registry TBD)

on:
  push:
    branches: [ main ]
  release:
    types: [published]
  schedule:
    - cron: '0 0 */5 * *'  # Run every 5 days at midnight UTC

jobs:
  build-and-push:
    name: 🐳 Build and Push Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: 📥 Checkout the git repo
        uses: actions/checkout@v4

      - name: 🖥️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: limes  # registry TBD; publishing disabled
          tags: |
            type=raw,value=${{ matrix.platform }}-latest,enable={{is_default_branch}}
            type=semver,pattern=${{ matrix.platform }}-{{version}}
            type=semver,pattern=${{ matrix.platform }}-{{major}}.{{minor}}
            type=semver,pattern=${{ matrix.platform }}-{{major}}
            type=sha,prefix=${{ matrix.platform }}-sha-
            type=schedule,pattern=${{ matrix.platform }}-{{date 'YYYYMMDD'}}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: web/
          platforms: ${{ matrix.platform }}
          push: false  # registry TBD: image publishing disabled
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max