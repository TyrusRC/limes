# Plain HTTP is the default. For TLS see limes-tls.conf (compose profile `https`).
include /etc/nginx/limes/http.inc;

server {
    listen                                          8082 default;
    listen                                          [::]:8082 default;
    server_name                                     limes;

    charset                                         utf-8;
    client_max_body_size                            800M;

    include /etc/nginx/limes/locations.inc;
}
