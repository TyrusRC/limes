{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page not found · Limes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">
  <script src="{% static 'limes/theme.js' %}"></script>
  <link href="{% static 'bootstrap/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
  <link href="{% static 'limes/limes.css' %}" rel="stylesheet" type="text/css" />
</head>
<body>
  <!-- standalone like login: there is no project in a 404's URL, and the shell needs one for every link -->
  <main class="l-auth">
    <div class="l-auth-brand">
      <img src="{% static 'img/logo.svg' %}" alt="" width="44" height="44">
      <span class="l-wordmark">limes</span>
    </div>
    <div class="card l-auth-card">
      <div class="card-body">
        <h1 class="l-auth-title">Page not found</h1>
        <p class="text-muted mb-4">The page you asked for does not exist, or you cannot open it.</p>
        <a href="/" class="btn btn-primary">Back to overview</a>
      </div>
    </div>
  </main>
</body>
</html>
