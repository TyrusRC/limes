{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Logged out · Limes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}">
  <script src="{% static 'limes/theme.js' %}"></script>
  <link href="{% static 'bootstrap/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
  <link href="{% static 'limes/limes.css' %}" rel="stylesheet" type="text/css" />
</head>
<body>
  <main class="l-auth">
    <div class="l-auth-brand">
      <img src="{% static 'img/logo.svg' %}" alt="" width="44" height="44">
      <span class="l-wordmark">limes</span>
    </div>
    <div class="card l-auth-card">
      <div class="card-body">
        <h1 class="l-auth-title">You have been logged out</h1>
        <p class="text-muted mb-4">Thank you for using Limes.</p>
        <a class="btn btn-primary w-100" href="{% url 'login' %}">Log in again</a>
      </div>
    </div>
    <p class="l-auth-foot"><a href="https://github.com/TyrusRC/limes/issues">Report an issue</a></p>
  </main>
</body>
</html>
