- model: scanEngine.enginetype
  pk: 1
  fields:
    engine_name: Full Scan
    profile: thorough
    yaml_configuration: |
      subdomain_discovery: {
        'uses_tools': ['subfinder', 'amass'],
        'enable_http_crawl': true,
        'threads': 30,
        'timeout': 5,
      }
      http_crawl: {}
      port_scan: {
        'enable_http_crawl': true,
        'timeout': 5,
        # 'exclude_ports': [],
        # 'exclude_subdomains': [],
        'ports': ['top-100'],
        'rate_limit': 150,
        'threads': 30,
        'passive': false,
        # 'use_naabu_config': false,
        # 'enable_nmap': true,
        # 'nmap_cmd': '',
        # 'nmap_script': '',
        # 'nmap_script_args': ''
      }
      fetch_url: {
        'uses_tools': ['katana', 'gau'],
        'remove_duplicate_endpoints': true,
        'duplicate_fields': ['content_length', 'page_title'],
        'enable_http_crawl': true,
        'ignore_file_extensions': ['png', 'jpg', 'jpeg', 'gif', 'mp4', 'mpeg', 'mp3'],
        'threads': 30
      }
      vulnerability_scan: {
        'enable_http_crawl': true,
        'concurrency': 50,
        'intensity': 'normal',
        'rate_limit': 150,
        'retries': 1,
        'timeout': 5,
        'nuclei': {
          'use_nuclei_config': false,
          'severities': ['unknown', 'info', 'low', 'medium', 'high', 'critical']
        }
      }
      screenshot: {
        'enable_http_crawl': true,
        'intensity': 'normal',
        'timeout': 10,
        'threads': 40
      }
    default_engine: true
